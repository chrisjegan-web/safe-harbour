<body>
<canvas id="c"></canvas>
<script src="peerjs.min.js"></script>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var H=760, W=1000, vw=0, vh=0, dpr=1, rot=false, scale=1, ox=0, oy=0;
var bg=null;
var CARGO=[{c:'#e4572e',d:'#a83a1b',n:'coral'},{c:'#f3b61f',d:'#b98608',n:'gold'},{c:'#8e5bd9',d:'#5f37a3',n:'violet'}];
var TYPES=[
 {r:16,cap:1,speed:36,hull:'#f4efe4',deck:'#d9c7a3',trim:'#7a5a3a'},
 {r:21,cap:2,speed:28,hull:'#27496d',deck:'#dfe7ee',trim:'#142d4c'},
 {r:27,cap:4,speed:21,hull:'#8c2f39',deck:'#e9dcc9',trim:'#571b22'}
];
var berths=[];
var MAPS=[], mapIdx=1, map=null, chips=[];
var boats=[], floats=[], blasts=[];
var state='menu', paused=false, score=0, away=0, best=0, time=0, spawnT=1, overT=0, nextId=1, clock=0;
var pend=[];             // ships about to arrive: an arrow shows at the edge first
var mpT=0, lastHonk=0;
var mp={st:'idle',role:'',code:'',entry:'',err:'',peer:null,conn:null,out:{},seen:{},next:1,result:null,gone:false,sent:0,got:0,last:0,pingT:0,myAgain:false,theirAgain:false};
var draws={};            // pointerId -> boat being steered
var soundOn=true;
try{best=parseInt(localStorage.getItem('safeharbour.best')||'0',10)||0;}catch(e){}
try{soundOn=localStorage.getItem('safeharbour.sound')!=='off';}catch(e){}
try{var mi=localStorage.getItem('safeharbour.map');if(mi!==null)mapIdx=Math.max(0,parseInt(mi,10)||0);}catch(e){}

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sq(v){v=Math.max(0,Math.min(1,v));return v*v;}
function shoreL(y){var a=sq((80-y)/80),b=sq((y-(H-80))/80);return 115+40*a-35*b+4*Math.sin(y/19)*(a+b);}
function shoreR(y){var a=sq((80-y)/80),b=sq((y-(H-80))/80);return 115-30*a+40*b+4*Math.sin(y/17+2)*(a+b);}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function cargoCount(b){var n=0;for(var i=0;i<b.cargo.length;i++)if(b.cargo[i]!==null)n++;return n;}
function northY(x){var t=sq((x-0.55*W)/(0.17*W));return (80+6*Math.sin(x/60))*(1-t)-50*t;}
function seY(x){var t=Math.max(0,Math.min(1,(x-0.6*W)/(0.22*W)));t=t*t*(3-2*t);return H+40-170*t+5*Math.sin(x/40);}
function isleF(a){return 1+0.07*Math.sin(3*a+0.5)+0.04*Math.sin(5*a);}
function isle(){return {x:0.47*W,y:Math.round(H*0.53),rx:70,ry:52};}
function isLand(x,y){return map.land(x,y,0);}

/* ---------- maps ---------- */
MAPS.push({name:'Twin Quays',pace:0.82,send:'T',recv:'B',
  land:function(x,y,i){return x<shoreL(y)-i||x>W-shoreR(y)+i;},
  docks:function(){
    var o=[],D=[[-1,0.25,0],[-1,0.5,1],[-1,0.75,2],[1,0.25,2],[1,0.5,0],[1,0.75,1]];
    for(var k=0;k<D.length;k++){var sd=D[k][0],y=Math.round(D[k][1]*H),sh=sd<0?shoreL(y):shoreR(y);o.push({x:sd<0?sh+46:W-sh-46,y:y,h:sd<0?Math.PI:0,col:D[k][2],wh:56});}
    return o;},
  spawns:function(){return[{e:'T',a:shoreL(0)+90,b:W-shoreR(0)-90},{e:'B',a:shoreL(H)+90,b:W-shoreR(H)-90}];},
  outline:function(g,o,wob){
    g.beginPath();
    [-1,1].forEach(function(sd){var sh=sd<0?shoreL:shoreR,X=function(d){return sd<0?d:W-d;};
      g.moveTo(X(-6),-6);for(var yy=-6;yy<=H+6;yy+=6)g.lineTo(X(sh(yy)+o+(wob?4*Math.sin(yy/23+o):0)),yy);g.lineTo(X(-6),H+6);g.closePath();});
  },
  extras:function(g){
    [-1,1].forEach(function(sd){
      var q0=sd<0?115:W-115, qx=Math.min(q0,sd<0?85:W-85), y;
      g.fillStyle='rgba(40,50,40,.2)'; rr(g,qx+(sd<0?-3:3),68,30,H-132,6); g.fill();
      g.fillStyle='#d8cfbf'; rr(g,qx,66,30,H-132,6); g.fill();
      g.strokeStyle='rgba(120,105,85,.4)'; g.lineWidth=1;
      for(y=80;y<H-70;y+=14){g.beginPath();g.moveTo(qx,y);g.lineTo(qx+30,y);g.stroke();}
      g.fillStyle='#b3a68f'; g.fillRect(sd<0?q0-4:q0,66,4,H-132);
    });
  }
});
MAPS.push({name:'Lighthouse Isle',send:'R',recv:'L',
  land:function(x,y,i){
    if(y<northY(x)-i)return true;
    if(y>seY(x)+i)return true;
    var I=isle(),dx=x-I.x,dy=y-I.y,f=isleF(Math.atan2(dy,dx)),rx=I.rx*f-i,ry=I.ry*f-i;
    if(rx<=0||ry<=0)return false;
    return dx*dx/(rx*rx)+dy*dy/(ry*ry)<1;},
  docks:function(){
    var I=isle(),nx=Math.max(0.26*W,250),sx=Math.min(0.86*W,W-140);
    return[
      {x:nx,y:northY(nx)+46,h:-Math.PI/2,col:1,wh:50},
      {x:nx+66,y:northY(nx+66)+46,h:-Math.PI/2,col:0,wh:50},
      {x:I.x-I.rx*isleF(Math.PI)-46,y:I.y,h:0,col:2,wh:0},
      {x:I.x+I.rx*isleF(0)+46,y:I.y,h:Math.PI,col:1,wh:0},
      {x:sx,y:seY(sx)-46,h:Math.PI/2,col:0,wh:56},
      {x:sx+66,y:seY(sx+66)-46,h:Math.PI/2,col:2,wh:56}];},
  spawns:function(){return[{e:'L',a:170,b:H-50},{e:'R',a:60,b:H-210},{e:'B',a:60,b:0.52*W},{e:'T',a:0.8*W,b:W-50}];},
  outline:function(g,o,wob){
    var x,a,I=isle(),w;
    g.beginPath();
    g.moveTo(-6,-6);for(x=-6;x<=W+6;x+=6)g.lineTo(x,northY(x)+o+(wob?4*Math.sin(x/23+o):0));g.lineTo(W+6,-6);g.closePath();
    g.moveTo(0.5*W,H+60);for(x=0.5*W;x<=W+6;x+=6)g.lineTo(x,seY(x)-o-(wob?4*Math.sin(x/23+o):0));g.lineTo(W+6,H+60);g.closePath();
    for(a=0;a<6.3;a+=0.06){w=wob?3*Math.sin(a*7+o):0;x=isleF(a);var px=I.x+Math.cos(a)*(I.rx*x+o+w),py=I.y+Math.sin(a)*(I.ry*x+o+w);if(a===0)g.moveTo(px,py);else g.lineTo(px,py);}
    g.closePath();
  },
  extras:function(g,R){
    var I=isle(),k,a,f;
    for(k=0;k<26;k++){
      a=R()*6.283; if(Math.abs(Math.cos(a))>0.75)continue; f=isleF(a)*(0.9+R()*0.1);
      var rx=I.x+Math.cos(a)*I.rx*f, ry=I.y+Math.sin(a)*I.ry*f, rs=4+R()*6;
      g.fillStyle='rgba(30,40,45,.3)'; g.beginPath(); g.ellipse(rx+2,ry+2,rs*1.2,rs,R()*3,0,7); g.fill();
      g.fillStyle=['#8d9196','#a3a7ab','#777c82'][(R()*3)|0]; g.beginPath(); g.ellipse(rx,ry,rs*1.2,rs,R()*3,0,7); g.fill();
      g.fillStyle='rgba(255,255,255,.25)'; g.beginPath(); g.ellipse(rx-rs*0.3,ry-rs*0.3,rs*0.5,rs*0.35,0,0,7); g.fill();
    }
    // lighthouse
    var lx=I.x, ly=I.y;
    g.fillStyle='rgba(255,236,150,.25)'; g.beginPath(); g.arc(lx,ly,30,0,7); g.fill();
    g.fillStyle='rgba(30,40,45,.3)'; g.beginPath(); g.arc(lx+3,ly+4,15,0,7); g.fill();
    g.fillStyle='#b9b4a8'; g.beginPath(); g.arc(lx,ly,15,0,7); g.fill();
    g.fillStyle='#ffffff'; g.beginPath(); g.arc(lx,ly,11,0,7); g.fill();
    g.strokeStyle='#d1483a'; g.lineWidth=3; g.beginPath(); g.arc(lx,ly,8,0,7); g.stroke();
    g.fillStyle='#ffe07a'; g.beginPath(); g.arc(lx,ly,4,0,7); g.fill();
  }
});

/* --- The Narrows: a channel between two banks, traffic from left and right --- */
function bump(x,c,w){var d=(x-c)/w;return Math.exp(-d*d);}
function nTop(x){return 80+45*bump(x,0.35*W,0.11*W)+4*Math.sin(x/37);}
function nBot(x){return H-80-45*bump(x,0.65*W,0.11*W)+4*Math.sin(x/41+1);}
MAPS.push({name:'The Narrows',pace:1.6,send:'R',recv:'L',
  land:function(x,y,i){return y<nTop(x)-i||y>nBot(x)+i;},
  docks:function(){
    var T=[[0.35,0],[0.58,1],[0.8,2]], B=[[0.18,1],[0.42,2],[0.88,0]], o=[], k, x;
    for(k=0;k<3;k++){x=T[k][0]*W;o.push({x:x,y:nTop(x)+46,h:-Math.PI/2,col:T[k][1],wh:50});}
    for(k=0;k<3;k++){x=Math.min(B[k][0]*W,W-70);o.push({x:x,y:nBot(x)-46,h:Math.PI/2,col:B[k][1],wh:50});}
    return o;},
  spawns:function(){return[{e:'L',a:nTop(0)+65,b:nBot(0)-65},{e:'R',a:nTop(W)+65,b:nBot(W)-65}];},
  outline:function(g,o,wob){
    var x; g.beginPath();
    g.moveTo(-6,-6);for(x=-6;x<=W+6;x+=6)g.lineTo(x,nTop(x)+o+(wob?4*Math.sin(x/23+o):0));g.lineTo(W+6,-6);g.closePath();
    g.moveTo(-6,H+6);for(x=-6;x<=W+6;x+=6)g.lineTo(x,nBot(x)-o-(wob?4*Math.sin(x/23+o):0));g.lineTo(W+6,H+6);g.closePath();
  },
  extras:function(g,R){
    // a beacon on the southern headland, and rocks off both points
    var hx=0.65*W, hy=nBot(hx)+26, k;
    for(k=0;k<14;k++){var top=k<7, cx=(top?0.35:0.65)*W+(R()-0.5)*0.2*W, cy=top?nTop(cx)-2-R()*6:nBot(cx)+2+R()*6, rs=4+R()*5;
      if(top&&Math.abs(cx-0.35*W)<60)continue;
      g.fillStyle='rgba(30,40,45,.3)'; g.beginPath(); g.ellipse(cx+2,cy+2,rs*1.2,rs,R()*3,0,7); g.fill();
      g.fillStyle=['#8d9196','#a3a7ab','#777c82'][(R()*3)|0]; g.beginPath(); g.ellipse(cx,cy,rs*1.2,rs,R()*3,0,7); g.fill();}
    beacon(g,hx,hy);
  },
  clear:function(){var hx=0.65*W;return[[hx,nBot(hx)+26]];}
});

/* --- Crescent Bay: one sheltered bay, every ship comes and goes through the mouth at the bottom --- */
function bay(){return {x:W/2,y:H+20,rx:W/2-70,ry:H-70};}
MAPS.push({name:'Crescent Bay',pace:1.3,send:'B',recv:'B',
  land:function(x,y,i){var b=bay(),dx=(x-b.x)/(b.rx-i),dy=(y-b.y)/(b.ry-i);return dx*dx+dy*dy>1;},
  docks:function(){
    var b=bay(), A=[[-160,0],[-128,1],[-101,2],[-79,0],[-52,1],[-20,2]], o=[], k;
    for(k=0;k<A.length;k++){
      var a=A[k][0]*Math.PI/180, ex=b.x+b.rx*Math.cos(a), ey=b.y+b.ry*Math.sin(a);
      var nx=Math.cos(a)/b.rx, ny=Math.sin(a)/b.ry, nl=Math.hypot(nx,ny); nx/=nl; ny/=nl;   // outward normal of the bay wall
      o.push({x:ex-nx*46,y:ey-ny*46,h:Math.atan2(ny,nx),col:A[k][1],wh:50});
    }
    return o;},
  spawns:function(){var b=bay();return[{e:'B',a:b.x-b.rx+110,b:b.x+b.rx-110}];},
  outline:function(g,o,wob){
    var b=bay(), a, w;
    g.beginPath(); g.moveTo(-6,H+80); g.lineTo(-6,-6); g.lineTo(W+6,-6); g.lineTo(W+6,H+80);
    for(a=0.12;a>=-Math.PI-0.12;a-=0.03){w=wob?3*Math.sin(a*19+o):0;g.lineTo(b.x+(b.rx-o-w)*Math.cos(a),b.y+(b.ry-o-w)*Math.sin(a));}
    g.closePath();
  },
  extras:function(g,R){beacon(g,34,H-40);beacon(g,W-34,H-40);},
  clear:function(){return[[34,H-40],[W-34,H-40]];}
});

/* --- Twin Isles: open sea, two islands, traffic from every side --- */
function isles(){return[{x:0.27*W,y:Math.round(0.42*H),rx:72,ry:54,p:0.5},{x:0.72*W,y:Math.round(0.6*H),rx:72,ry:54,p:2.1}];}
function isleF2(a,p){return 1+0.06*Math.sin(3*a+p)+0.04*Math.sin(5*a+p*2);}
MAPS.push({name:'Twin Isles',pace:1.45,send:'R',recv:'L',
  land:function(x,y,i){
    var I=isles();
    for(var k=0;k<I.length;k++){var dx=x-I[k].x,dy=y-I[k].y,f=isleF2(Math.atan2(dy,dx),I[k].p),rx=I[k].rx*f-i,ry=I[k].ry*f-i;
      if(rx>0&&ry>0&&dx*dx/(rx*rx)+dy*dy/(ry*ry)<1)return true;}
    return false;},
  docks:function(){
    var I=isles(), a=I[0], b=I[1], P=Math.PI;
    function at(q,ang,col){var f=isleF2(ang,q.p),c=Math.cos(ang),s=Math.sin(ang);
      return {x:q.x+c*(q.rx*f+46)*(Math.abs(c)>0.5?1:0)+0, y:q.y+s*(q.ry*f+46)*(Math.abs(s)>0.5?1:0), h:ang+P, col:col, wh:0};}
    return[at(a,P,0),at(a,0,1),at(a,P/2,2),at(b,P,2),at(b,0,0),at(b,-P/2,1)];},
  spawns:function(){return[{e:'L',a:70,b:H-60},{e:'R',a:70,b:H-60},{e:'T',a:230,b:W-150},{e:'B',a:60,b:W-60}];},
  outline:function(g,o,wob){
    var I=isles(), a, k; g.beginPath();
    for(k=0;k<I.length;k++){
      for(a=0;a<6.3;a+=0.06){var f=isleF2(a,I[k].p),w=wob?3*Math.sin(a*7+o):0,px=I[k].x+Math.cos(a)*(I[k].rx*f+o+w),py=I[k].y+Math.sin(a)*(I[k].ry*f+o+w);if(a===0)g.moveTo(px,py);else g.lineTo(px,py);}
      g.closePath();}
  },
  extras:function(g,R){
    var I=isles(), k, n;
    for(k=0;k<I.length;k++)for(n=0;n<22;n++){
      var a=R()*6.283, c=Math.cos(a), sn=Math.sin(a);
      if(Math.abs(c)>0.8||(k===0?sn>0.8:sn<-0.8))continue;       // keep the dock approaches clear
      var f=isleF2(a,I[k].p)*(0.9+R()*0.1), rx=I[k].x+c*I[k].rx*f, ry=I[k].y+sn*I[k].ry*f, rs=4+R()*5;
      g.fillStyle='rgba(30,40,45,.3)'; g.beginPath(); g.ellipse(rx+2,ry+2,rs*1.2,rs,R()*3,0,7); g.fill();
      g.fillStyle=['#8d9196','#a3a7ab','#777c82'][(R()*3)|0]; g.beginPath(); g.ellipse(rx,ry,rs*1.2,rs,R()*3,0,7); g.fill();}
    beacon(g,I[0].x,I[0].y-8); beacon(g,I[1].x,I[1].y+8);
  },
  clear:function(){var I=isles();return[[I[0].x,I[0].y-8],[I[1].x,I[1].y+8]];}
});
function beacon(g,lx,ly){
  g.fillStyle='rgba(255,236,150,.25)'; g.beginPath(); g.arc(lx,ly,26,0,7); g.fill();
  g.fillStyle='rgba(30,40,45,.3)'; g.beginPath(); g.arc(lx+3,ly+4,13,0,7); g.fill();
  g.fillStyle='#b9b4a8'; g.beginPath(); g.arc(lx,ly,13,0,7); g.fill();
  g.fillStyle='#ffffff'; g.beginPath(); g.arc(lx,ly,9.5,0,7); g.fill();
  g.strokeStyle='#d1483a'; g.lineWidth=2.6; g.beginPath(); g.arc(lx,ly,6.8,0,7); g.stroke();
  g.fillStyle='#ffe07a'; g.beginPath(); g.arc(lx,ly,3.4,0,7); g.fill();
}

/* ---------- layout ---------- */
function buildMap(){
  if(mapIdx>=MAPS.length)mapIdx=0;
  map=MAPS[mapIdx];
  berths=map.docks();
  for(var i=0;i<berths.length;i++)berths[i].occupant=null;
  // keep docked boats attached after a resize
  for(var k=0;k<boats.length;k++){var b=boats[k];
    if(b.berthIdx>=0&&b.state==='docked'){var nb=berths[b.berthIdx];nb.occupant=b;b.x=nb.x;b.y=nb.y;}
    if(b.targetIdx>=0&&b.path.length){var t=berths[b.targetIdx];b.path[b.path.length-1]={x:t.x,y:t.y};}
  }
}
function setMap(i){mapIdx=i;boats=[];try{localStorage.setItem('safeharbour.map',String(i));}catch(e){}buildMap();paintBackground();}
function resize(){
  vw=window.innerWidth||800; vh=window.innerHeight||600;
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  rot=vh>vw;
  var lw=rot?vh:vw, lh=rot?vw:vh;
  // size the world to the physical screen: about 0.9 CSS px per world unit keeps ships finger-sized on phones
  H=Math.round(Math.max(420,Math.min(760,lh/0.9)));
  scale=Math.min(lh/H,lw/800);
  W=Math.min(1750,lw/scale);
  ox=(lw-W*scale)/2; oy=(lh-H*scale)/2;
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  buildMap(); paintBackground();
}
function applyT(){
  var s=scale*dpr;
  if(!rot)ctx.setTransform(s,0,0,s,ox*dpr,oy*dpr);
  else ctx.setTransform(0,s,-s,0,(vw-oy)*dpr,ox*dpr);
}
function toWorld(e){
  var r=cv.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
  if(!rot)return{x:(cx-ox)/scale,y:(cy-oy)/scale};
  return{x:(cy-ox)/scale,y:(vw-oy-cx)/scale};
}

/* ---------- painted background ---------- */
function paintBackground(){
  var s=scale*dpr;
  bg=document.createElement('canvas'); bg.width=Math.max(1,Math.round(W*s)); bg.height=Math.max(1,Math.round(H*s));
  var g=bg.getContext('2d'); g.setTransform(s,0,0,s,0,0);
  var R=rng(7), i, x, y, k;
  var gr=g.createLinearGradient(0,0,W,0); gr.addColorStop(0,'#2a9d9a'); gr.addColorStop(0.24,'#1c8196'); gr.addColorStop(0.5,'#14607d'); gr.addColorStop(0.76,'#1c8196'); gr.addColorStop(1,'#2a9d9a');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  var hues=['#2fb0a8','#1b7a93','#18688a','#3bb7b0','#125a78','#249aa0'];
  for(i=0;i<760;i++){
    x=R()*W; y=R()*H; g.save(); g.translate(x,y); g.rotate((R()-0.5)*0.5);
    g.globalAlpha=0.05+R()*0.09; g.fillStyle=hues[(R()*hues.length)|0];
    g.beginPath(); g.ellipse(0,0,30+R()*70,5+R()*12,0,0,Math.PI*2); g.fill(); g.restore();
  }
  g.globalAlpha=1;

var AC=null, master=null, musicTimer=null, nextNote=0, stepIdx=0, noiseBuf=null;

    AC=new A(); master=AC.createGain(); master.gain.value=soundOn?1:0; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.8,AC.sampleRate); var d=noiseBuf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);

}

  if(!AC||AC.state!=='running')return;
  if(nextNote<AC.currentTime)nextNote=AC.currentTime+0.05;
  var q=0.3;
  while(nextNote<AC.currentTime+0.35){
    var s=stepIdx%48, bar=(s/6)|0, k=s%6, ch=CH[bar];
    if(state==='play'&&!paused||state==='menu'){
      tone(midi(ch[ARP[k]]+12),nextNote,q*1.6,'triangle',0.05);
      if(k===0)tone(midi(ch[0]-12),nextNote,q*5.6,'sine',0.09);
      for(var i=0;i<MEL.length;i++)if(MEL[i][0]===s)tone(midi(MEL[i][1]),nextNote,MEL[i][2]*q*0.95,'sine',0.055);

}

/* ---------- game ---------- */
function newGame(){
  boats=[];floats=[];blasts=[];pend=[];draws={};score=0;away=0;time=0;spawnT=1;paused=false;
  for(var i=0;i<berths.length;i++)berths[i].occupant=null;
  state='play';

function randCargo(ti){

  for(var k=0;k<TYPES[ti].cap;k++)cargo.push(k===0||Math.random()>=mix?first:(Math.random()*pool)|0);
  return cargo;
}
function makeBoat(p){
  var T=TYPES[p.type];
  return {id:nextId++,x:p.x,y:p.y,h:p.h,dh:p.h,type:p.type,r:T.r,speed:T.speed,cargo:p.cargo,path:[],state:'sail',
    berthIdx:-1,targetIdx:-1,unloadT:0,entering:true,grace:0,trail:[],trailT:0,warn:false,honkT:0};
}
function edgeSeg(e){var sg=map.spawns();for(var i=0;i<sg.length;i++)if(sg[i].e===e)return sg[i];return null;}
function edgePoint(e,v){
  if(e==='T')return{x:v,y:-34,h:Math.PI/2}; if(e==='B')return{x:v,y:H+34,h:-Math.PI/2};
  if(e==='L')return{x:-34,y:v,h:0}; return{x:W+34,y:v,h:Math.PI};
}
function spawn(){
  if(boats.length>=14)return;
  for(var tries=0;tries<12;tries++){
    var segs=map.spawns(), tot=0, q, x, y, h;
    for(q=0;q<segs.length;q++)tot+=segs[q].b-segs[q].a;
    var pick=Math.random()*tot, sg=segs[0];
    for(q=0;q<segs.length;q++){if(pick<segs[q].b-segs[q].a){sg=segs[q];break;}pick-=segs[q].b-segs[q].a;}
    var v=sg.a+Math.random()*(sg.b-sg.a);
    if(sg.e==='T'){x=v;y=-34;h=Math.PI/2;}else if(sg.e==='B'){x=v;y=H+34;h=-Math.PI/2;}else if(sg.e==='L'){x=-34;y=v;h=0;}else{x=W+34;y=v;h=Math.PI;}
    h+=(Math.random()-0.5)*0.8;
    var ok=true;
    for(var i=0;i<boats.length;i++){var o=boats[i];if(Math.hypot(o.x-x,o.y-y)<170)ok=false;}
    for(i=0;i<pend.length;i++)if(Math.hypot(pend[i].x-x,pend[i].y-y)<170)ok=false;
    if(!ok)continue;
    var r=Math.random(), ti=time<60?(r<0.55?0:1):(r<0.45?0:r<0.8?1:2);
    pend.push({x:x,y:y,h:h,type:ti,cargo:randCargo(ti),t:1.6,opp:false});
    return;
  }
}
function crash(a,b){
  var x=(a.x+b.x)/2, y=(a.y+b.y)/2;
  blasts.push({x:x,y:y,t:0}); sfx('crash');
  state='crash'; overT=0; draws={};
  if(mp.st==='play'){mp.result='lose';mp.st='done';send({k:'lost'});}
  if(score>best){best=score;try{localStorage.setItem('safeharbour.best',String(best));}catch(e){}}
}
function undock(b){
  if(b.state!=='docked')return;
  var be=berths[b.berthIdx]; b.leaving={x:be.x,y:be.y};   // land is ignored only right beside the dock being left
  be.occupant=null; b.berthIdx=-1; b.state='sail'; b.grace=0; b.unloadT=0;
}
function updateBoat(b,dt){
  b.hold=false;
  if(b.grace>0)b.grace-=dt;
  if(b.state==='docked'){
    var be=berths[b.berthIdx], col=be.col, idx=b.cargo.indexOf(col);

      if(b.unloadT>=1.3){b.unloadT=0;b.cargo[idx]=null;score++;sfx('pop');floats.push({x:b.x,y:b.y-20,t:0,text:'+1',c:CARGO[col].c});}
    }

function update(dt){
  clock+=dt;
  if(mp.st==='play'){mpT-=dt;if(mpT<=0){mpT=0.25;mpTick();}}
  var i,j;
  for(i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>1)floats.splice(i,1);}
  for(i=0;i<blasts.length;i++)blasts[i].t+=dt;
  if(state==='crash'){overT+=dt;if(overT>1.4)state='over';return;}
  if(state!=='play'||paused)return;
  time+=dt; spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=Math.max(3.3,8.8-time*0.016)*(map.pace||1)*(0.8+Math.random()*0.4)*(mp.st==='play'?1.7:1);}
  for(i=pend.length-1;i>=0;i--){pend[i].t-=dt;if(pend[i].t<=0){boats.push(makeBoat(pend[i]));pend.splice(i,1);}}
  for(i=0;i<boats.length;i++)updateBoat(boats[i],dt);
  for(i=boats.length-1;i>=0;i--)if(boats[i].gone){for(var k in draws)if(draws[k]===boats[i])delete draws[k];boats.splice(i,1);}
  for(i=0;i<boats.length;i++)boats[i].warn=false;
  for(i=0;i<boats.length;i++)for(j=i+1;j<boats.length;j++){
    var a=boats[i], b=boats[j];
    if(a.state==='docked'&&b.state==='docked')continue;
    var d=Math.hypot(a.x-b.x,a.y-b.y), rs=a.r+b.r;
    if(d<rs*0.78){crash(a,b);return;}
    if(d<rs*1.7+26){a.warn=b.warn=true;
      // sound the warning: ships under way always; beside a docked ship only when really close
      if((a.state!=='docked'&&b.state!=='docked')||d<rs*1.15){
        if(a.state!=='docked'&&clock>a.honkT){a.honkT=clock+2.4;honk(a.type);}
        else if(b.state!=='docked'&&clock>b.honkT){b.honkT=clock+2.4;honk(b.type);}
      }
    }
  }
}

/* ---------- two players: the phones connect directly to each other (PeerJS / WebRTC) ---------- */
var CODE_ABC='ABCDEFGHJKLMNPRSTUVWXYZ', PEER_PREFIX='safeharbour-game-';
function newCode(){var c='';for(var i=0;i<4;i++)c+=CODE_ABC[(Math.random()*CODE_ABC.length)|0];return c;}
function send(m){try{if(mp.conn&&mp.conn.open)mp.conn.send(m);}catch(e){}}
function netClose(){
  var c=mp.conn, p=mp.peer; mp.conn=null; mp.peer=null;
  try{if(c)c.close();}catch(e){} try{if(p)p.destroy();}catch(e){}
}
function mpLeave(){
  if(mp.st!=='idle')send({k:'bye'});
  netClose(); mp.st='idle'; mp.result=null; mp.err=''; mp.entry=''; mp.gone=false; mp.myAgain=mp.theirAgain=false;
}
function enterLobby(){mpLeave(); state='lobby'; boats=[]; pend=[]; mp.st='choose';}
function hostGame(){
  netClose(); state='lobby'; mp.st='host'; mp.role='host'; mp.code=''; mp.err=''; mp.gone=false;
  if(!window.Peer){mp.err='Two-player needs an internet connection.';return;}
  var code=newCode(), pr;
  try{pr=new Peer(PEER_PREFIX+code);}catch(e){mp.err="Two-player isn't available in this browser.";return;}
  mp.peer=pr;
  pr.on('open',function(){if(mp.peer===pr)mp.code=code;});
  pr.on('connection',function(c){
    if(mp.peer!==pr)return;
    if(mp.conn){try{c.close();}catch(e){}return;}      // a game is already under way on this code
    wire(c);
  });
  pr.on('disconnected',function(){if(mp.peer===pr&&!pr.destroyed){try{pr.reconnect();}catch(e){}}});
  pr.on('error',function(e){
    if(mp.peer!==pr)return;
    if(e&&e.type==='unavailable-id'){hostGame();return;}  // code already in use: pick another
    if(mp.st==='host'&&!mp.conn)mp.err="Can't reach the pairing service. Check the internet, then try again.";
  });
}
function joinGame(code){
  netClose(); state='lobby'; mp.st='connecting'; mp.role='join'; mp.code=code; mp.err=''; mp.gone=false;
  if(!window.Peer){mp.err='Two-player needs an internet connection.';mp.st='join';return;}
  var pr; try{pr=new Peer();}catch(e){mp.err="Two-player isn't available in this browser.";mp.st='join';return;}
  mp.peer=pr;
  pr.on('open',function(){if(mp.peer===pr)wire(pr.connect(PEER_PREFIX+code,{reliable:true}));});
  pr.on('disconnected',function(){if(mp.peer===pr&&!pr.destroyed){try{pr.reconnect();}catch(e){}}});
  pr.on('error',function(e){
    if(mp.peer!==pr||mp.st!=='connecting')return;
    mp.err=(e&&e.type==='peer-unavailable')?'No game found with code '+code+'.':"Can't connect. Check the internet, then try again.";
    mp.st='join'; mp.entry=''; netClose();
  });
}
function wire(c){
  mp.conn=c;
  c.on('open',function(){
    if(mp.conn!==c)return; mp.last=clock;
    if(mp.role==='host'){send({k:'start',map:mapIdx});startMP(mapIdx);}
  });
  c.on('data',function(d){if(mp.conn!==c||!d||typeof d!=='object')return;mp.last=clock;onMsg(d);});
  c.on('close',function(){if(mp.conn===c)oppGone();});
  c.on('error',function(){if(mp.conn===c)oppGone();});
}
function oppGone(){
  if(mp.st==='play')endMP('left');
  else if(mp.st==='done'||mp.st==='rewait'){mp.gone=true;if(mp.st==='rewait'){state='over';mp.st='done';if(!mp.result)mp.result='left';}}
  else if(mp.st==='connecting'){mp.err='The connection was lost.';mp.st='join';mp.entry='';netClose();}
}
function startMP(mi){
  if(mi!==mapIdx&&MAPS[mi])setMap(mi);
  mp.out={}; mp.seen={}; mp.sent=0; mp.got=0; mp.result=null; mp.gone=false; mp.myAgain=mp.theirAgain=false; mp.last=clock; mp.pingT=0;
  newGame(); mp.st='play';
}
function endMP(res){
  if(mp.st!=='play')return;
  mp.result=res; mp.st='done'; if(res==='left')mp.gone=true;
  state='over'; draws={}; sfx('dock');
}
function askRematch(){
  if(mp.gone||!mp.conn||!mp.conn.open){enterLobby();return;}
  mp.myAgain=true; send({k:'again'}); state='lobby'; mp.st='rewait'; boats=[]; pend=[]; tryRematch();

function tryRematch(){if(mp.role==='host'&&mp.myAgain&&mp.theirAgain&&mp.st==='rewait'){send({k:'start',map:mapIdx});startMP(mapIdx);}}
function onMsg(d){
  if(d.k==='start'){if(mp.role==='join'&&(mp.st==='connecting'||mp.st==='rewait'||mp.st==='done'))startMP(d.map|0);}
  else if(d.k==='ship'){
    if(mp.st!=='play')return;
    send({k:'ack',id:d.id});
    if(mp.seen[d.id])return; mp.seen[d.id]=1;
    var ti=d.t|0; if(ti<0||ti>2)ti=0; var f=+d.f; if(!(f>=0&&f<=1))f=0.5;
    // it arrives on the opposite side to the one it left by, at the matching spot (kept to open water)
    var oe={L:'R',R:'L',T:'B',B:'T'}[d.e], sg=oe?edgeSeg(oe):null, v;
    if(sg)v=Math.max(sg.a,Math.min(sg.b,f*((oe==='L'||oe==='R')?H:W)));
    else{oe=map.recv;sg=edgeSeg(oe);if(!sg)return;v=sg.a+f*(sg.b-sg.a);}
    var p=edgePoint(oe,v), q=0;
    for(var i=0;i<pend.length;i++)if(pend[i].opp)q++;
    pend.push({x:p.x,y:p.y,h:p.h,type:ti,cargo:randCargo(ti),t:2.2+q*0.9,opp:true}); mp.got++; sfx('incoming');
  }
  else if(d.k==='ack'){delete mp.out[d.id];}
  else if(d.k==='lost'){endMP('win');}
  else if(d.k==='again'){mp.theirAgain=true;tryRematch();}
  else if(d.k==='bye'){oppGone();}

function mpTick(){
  // ships in transit are re-sent until the other phone confirms them
  for(var id in mp.out){var o=mp.out[id];if(clock>=o.next){o.tries++;o.next=clock+1.5;if(o.tries>8)delete mp.out[id];else send(o.msg);}}

function sendShip(b,e){
  // where along that edge the ship left, as a fraction of the screen, so it works between different phones
  var f=Math.max(0,Math.min(1,(e==='L'||e==='R')?b.y/H:b.x/W));
  var id=mp.next++; mp.out[id]={msg:{k:'ship',id:id,t:b.type,e:e,f:Math.round(f*1000)/1000},tries:0,next:0}; mp.sent++;

/* ---------- input ---------- */
function hitBtn(p,x,y,r){return Math.hypot(p.x-x,p.y-y)<r;}
function nearestBerth(p,b){
  for(var i=0;i<berths.length;i++){var be=berths[i];
    if(be.occupant)continue;
    if(b.cargo.indexOf(be.col)<0)continue;   // only ships carrying this dock's colour may berth here
    var dx=p.x-be.x,dy=p.y-be.y,c=Math.cos(be.h),s=Math.sin(be.h);
    if(Math.abs(dx*c+dy*s)<50&&Math.abs(-dx*s+dy*c)<24)return i;}
  return -1;
}
function down(e){
  e.preventDefault();
  var p=toWorld(e);
  if(state!=='play'||paused)return;
  if(hitBtn(p,W-40,32,24)||hitBtn(p,W-92,32,24))return;
  var bestB=null, bd=1e9;
  for(var i=0;i<boats.length;i++){var b=boats[i], d=Math.hypot(b.x-p.x,b.y-p.y);
    if(d<Math.max(62,b.r*2.4)&&d<bd){bd=d;bestB=b;}}
  if(!bestB)return;
  for(var k in draws)if(draws[k]===bestB)delete draws[k];
  draws[e.pointerId]=bestB;
  if(bestB.state!=='docked'){bestB.path=[];bestB.targetIdx=-1;}
  bestB.drawStart={x:p.x,y:p.y};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
}
function move(e){
  var b=draws[e.pointerId]; if(!b)return;
  e.preventDefault();
  var p=toWorld(e);
  p.x=Math.max(2,Math.min(W-2,p.x)); p.y=Math.max(2,Math.min(H-2,p.y));
  if(b.state==='docked'){
    if(Math.hypot(p.x-b.x,p.y-b.y)<30)return;
    undock(b); b.path=[]; b.targetIdx=-1;
  }
  var last=b.path.length?b.path[b.path.length-1]:b;
  if(Math.hypot(p.x-last.x,p.y-last.y)<7)return;
  var bi=nearestBerth(p,b);
  if(bi>=0&&Math.hypot(b.x-berths[bi].x,b.y-berths[bi].y)>50){
    var be=berths[bi];
    b.path.push({x:be.x,y:be.y}); b.targetIdx=bi;
    delete draws[e.pointerId]; sfx('snap'); return;
  }
  b.path.push(p);
  if(b.path.length>900)b.path.shift();
}
function up(e){
  e.preventDefault();
  audioInit();
  var p=toWorld(e), b=draws[e.pointerId];
  if(b){
    delete draws[e.pointerId];
    if(b.path.length&&b.targetIdx<0){
      var l=b.path[b.path.length-1];
      if(l.y<30)b.path.push({x:l.x,y:-70}); else if(l.y>H-30)b.path.push({x:l.x,y:H+70}); else if(l.x<30)b.path.push({x:-70,y:l.y}); else if(l.x>W-30)b.path.push({x:W+70,y:l.y});
    }
    return;
  }
  if(state==='menu'||state==='over'||state==='lobby'){
    for(var ci=0;ci<chips.length;ci++){var ch=chips[ci];
      if(p.x>ch.x&&p.x<ch.x+ch.w&&p.y>ch.y&&p.y<ch.y+ch.h){
        if(ch.act==='map'){if(ch.map!==mapIdx)setMap(ch.map);}
        else if(ch.act==='solo'){mpLeave();newGame();}
        else if(ch.act==='mp'){enterLobby();}
        else if(ch.act==='host'){hostGame();}
        else if(ch.act==='join'){mp.st='join';mp.entry='';mp.err='';}
        else if(ch.act==='key'){if(mp.entry.length<4){mp.entry+=ch.ch;mp.err='';sfx('snap');if(mp.entry.length===4)joinGame(mp.entry);}}
        else if(ch.act==='back'){mp.entry=mp.entry.slice(0,-1);mp.err='';}
        else if(ch.act==='share'){shareInvite();}
        else if(ch.act==='again'){if(mp.result)askRematch();else newGame();}
        else{mpLeave();state='menu';boats=[];pend=[];}
        return;}}
    return;
  }
  if(state==='play'){
    if(hitBtn(p,W-40,32,24)&&mp.st!=='play'){paused=!paused;return;}
    if(hitBtn(p,W-92,32,24)){setSound(!soundOn);return;}
    if(paused){paused=false;}
  }
}
